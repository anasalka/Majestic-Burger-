<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماجيستيك برجر | Majestic Burger</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#171717;--ink:#fff;--mute:#a8a8a8;--line:#2b2b2b;--o1:#ffb300;--o2:#ff7a00;--onacc:#1a0f00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff7ee;--card:#fff;--ink:#1a1209;--mute:#7d6e5f;--line:#f0dfcb;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#171717;--ink:#fff;--mute:#a8a8a8;--line:#2b2b2b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6}
.grad{background:linear-gradient(135deg,var(--o1),var(--o2));color:var(--onacc)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--o2);display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand img{width:44px;height:44px;border-radius:50%}
.btn{border:1.5px solid var(--o2);background:transparent;color:var(--o2);border-radius:999px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:0 16px}
.hero{text-align:center;padding:26px 0 8px}
.hero img{width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 3px var(--o2),0 10px 30px rgba(255,122,0,.35)}
.hero h1{margin:12px 0 2px;font-size:28px;font-weight:800}
.hero p{margin:0;color:var(--mute)}
.notice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.notice span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
h2.sec{font-size:17px;margin:18px 0 8px}
.br{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bc{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 8px;font:inherit;text-align:center;cursor:pointer}
.bc b{display:block;font-size:15px}
.bc small{color:var(--mute)}
.bc.on{border-color:var(--o2);background:linear-gradient(135deg,rgba(255,179,0,.18),rgba(255,122,0,.18))}
.bc.on b::before{content:"✓ ";color:var(--o2)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:720px;margin:auto}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}
.tab.on{border:0;padding:8px 17px;font-weight:700}
.menu{display:grid;gap:12px;padding-bottom:130px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.ico{font-size:32px;width:56px;height:56px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.item h3{margin:0;font-size:16px}
.item p{margin:0 0 4px;font-size:12.5px;color:var(--mute)}
.grow{flex:1;min-width:0}
.price{font-weight:800;color:var(--o2)}
.add{border:0;width:38px;height:38px;border-radius:50%;font-size:24px;font-weight:700;cursor:pointer;flex:none}
.bar{position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:none}
.bar.show{display:block}
.bar button{width:100%;max-width:720px;display:flex;justify-content:space-between;margin:auto;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 24px rgba(255,122,0,.4)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:7;display:none}
.shade.show{display:block}
.sheet{position:fixed;inset:auto 0 0 0;max-height:90%;overflow:auto;background:var(--bg);border-top:3px solid var(--o2);z-index:8;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:none;max-width:720px;margin:auto}
.sheet.show{display:block}
.sheet h2{margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--o2);background:transparent;color:var(--o2);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0 4px}
.pay{background:var(--card);border:1px dashed var(--o2);border-radius:12px;padding:8px 12px;font-size:13.5px;margin:8px 0 12px}
input,textarea{width:100%;margin-bottom:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--o2)}
.send{width:100%;border:0;background:#1fa855;color:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.warn{color:var(--o1);font-size:13.5px;margin:0 0 8px}
.empty{text-align:center;color:var(--mute);padding:24px 0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 0 110px}
</style>
</head>

var T={ar:{name:"ماجيستيك برجر",sub:"بأيدي عمانية ١٠٠٪",notice:["🏪 الاستلام من الفرع فقط","🚫 لا يوجد توصيل","💵 الدفع عند الاستلام"],brT:"١. اختر الفرع للاستلام",view:"عرض الطلب",cart:"طلبك",empty:"السلة فاضية",total:"المجموع",nm:"الاسم",ph:"رقم الجوال",notes:"وصف أو ملاحظات على الطلب (اختياري)",send:"أرسل الطلب عبر واتساب",pay:"💵 الدفع عند الاستلام فقط، ولا يوجد توصيل. استلم طلبك من الفرع.",pick:"اختر الفرع أولاً",first:"اختر الفرع أولاً لتظهر لك قائمته",soon:"قائمة هذا الفرع قريباً إن شاء الله",swc:"تغيير الفرع سيفرغ السلة لأن لكل فرع قائمته الخاصة. متابعة؟",pickAt:"استلام من",chg:"تغيير",foot:"ماجيستيك برجر · بأيدي عمانية ١٠٠٪"},
en:{name:"Majestic Burger",sub:"Made by Omani hands, 100%",notice:["🏪 Pickup from branch only","🚫 No delivery","💵 Pay on pickup"],brT:"1. Choose your pickup branch",view:"View order",cart:"Your order",empty:"Your cart is empty",total:"Total",nm:"Name",ph:"Phone number",notes:"Notes or description for the order (optional)",send:"Send order via WhatsApp",pay:"💵 Payment on pickup only, no delivery. Collect your order at the branch.",pick:"Please choose a branch first",first:"Choose a branch to see its menu",soon:"This branch menu is coming soon",swc:"Changing branch will empty your cart because each branch has its own menu. Continue?",pickAt:"Pickup from",chg:"Change",foot:"Majestic Burger · Made by Omani hands, 100%"}};
// ==================================
var L="ar",cat="b",br=null,cart={};
var $=function(i){return document.getElementById(i)};
try{var sv=JSON.parse(localStorage.getItem("mbcart2")||"{}");if(sv&&typeof sv==="object")cart=sv;var sb=localStorage.getItem("mbbr2");if(sb)br=sb}catch(e){}
function save(){try{localStorage.setItem("mbcart2",JSON.stringify(cart));if(br)localStorage.setItem("mbbr2",br)}catch(e){}}
function m(n){return n.toFixed(3)+" "+CUR[L]}
function count(){var n=0;for(var k in cart)n+=cart[k];return n}
function total(){var s=0;cur().items.forEach(function(x){s+=(cart[x.id]||0)*x.p});return s}
function brObj(){return BR.filter(function(b){return b.id===br})[0]}
function brCards(){return BR.map(function(b){return'<button class="bc'+(b.id===br?" on":"")+'" data-b="'+b.id+'"><b>'+b[L]+"</b><small>📞 "+b.n+(b.t?" · "+b.t[L]:"")+"</small></button>"}).join("")}
function render(){
 var t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 $("nm0").textContent=t.name;$("h1").textContent=t.name;$("sub").textContent=t.sub;$("lang").textContent=L==="ar"?"English":"عربي";
 $("notice").innerHTML=t.notice.map(function(s){return"<span>"+s+"</span>"}).join("");
 $("brT").textContent=t.brT;$("br").innerHTML=brCards();$("foot").textContent=t.foot;
 if(!cur().cats.some(function(c){return c.id===cat}))cat=cur().cats.length?cur().cats[0].id:"";
 var msg=!br?'<div class="empty">'+t.first+"</div>":!cur().items.length?'<div class="empty">'+t.soon+"</div>":"";
 $("tabs").innerHTML=cur().cats.map(function(c){return'<button class="tab'+(c.id===cat?" on grad":"")+'" data-c="'+c.id+'">'+c[L]+"</button>"}).join("");
 $("menu").innerHTML=msg||cur().items.filter(function(x){return x.c===cat}).map(function(x){
  return'<div class="item"><div class="ico">'+x.i+'</div><div class="grow"><h3>'+x[L]+'</h3><span class="price">'+m(x.p)+'</span></div><button class="add grad" data-a="'+x.id+'" aria-label="+">+</button></div>'}).join("");
 var n=count();$("bar").className="bar"+(n?" show":"");$("barL").textContent=t.view+" ("+n+")";$("barT").textContent=m(total());
 if($("sheet").className.indexOf("show")>-1)sheet(true);
}
function sheet(keep){
 var t=T[L],rows="",old={};
 if(keep)["n1","p1","o1"].forEach(function(k){if($(k))old[k]=$(k).value});
 cur().items.forEach(function(x){var q=cart[x.id];if(q)rows+='<div class="row"><div class="grow"><b>'+x[L]+'</b><br><span class="price">'+m(x.p*q)+'</span></div><div class="qty"><button data-m="'+x.id+'">−</button><b>'+q+'</b><button data-a="'+x.id+'">+</button></div></div>'});
 var h="<h2>"+t.cart+"</h2>";
 if(!rows){h+='<div class="empty">'+t.empty+"</div>"}
 else{
  h+=rows+'<div class="tot"><span>'+t.total+"</span><span>"+m(total())+"</span></div>";
  h+='<div class="pay">'+t.pay+"</div>";
  h+='<h2 class="sec">📍 '+t.pickAt+": "+(brObj()?brObj()[L]:"")+"</h2>";
  if(!br)h+='<p class="warn">⚠️ '+t.pick+"</p>";
  h+='<div style="height:10px"></div><input id="n1" placeholder="'+t.nm+'"><input id="p1" type="tel" inputmode="tel" placeholder="'+t.ph+'"><textarea id="o1" rows="2" placeholder="'+t.notes+'"></textarea><button class="send" id="go">'+t.send+"</button>";
 }
 $("sheet").innerHTML=h;
 for(var k in old)if($(k))$(k).value=old[k];
}
function show(v){$("sheet").className="sheet"+(v?" show":"");$("shade").className="shade"+(v?" show":"");if(v)sheet()}
function nums(i){return["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"][i]||(i+1)+"."}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;render()}
 else if(b.dataset.b){if(br&&b.dataset.b!==br&&count()){if(!confirm(T[L].swc))return;cart={}}br=b.dataset.b;cat="";save();render()}
 else if(b.dataset.a){var i=b.dataset.a;cart[i]=(cart[i]||0)+1;save();render()}
 else if(b.dataset.m){var j=b.dataset.m;cart[j]=(cart[j]||1)-1;if(cart[j]<=0)delete cart[j];save();render()}
 else if(b.id==="lang"){L=L==="ar"?"en":"ar";render()}
 else if(b.id==="open")show(true);
 else if(b.id==="go"){
  var B=brObj();
  if(!B){alert(T[L].pick);return}
  var nm=$("n1").value.trim(),ph=$("p1").value.trim();
  if(!nm||!ph){alert(L==="ar"?"فضلاً اكتب الاسم ورقم الجوال":"Please enter your name and phone");return}
  var msg="🍔 *طلب جديد · ماجيستيك برجر*\n━━━━━━━━━━━━\n📍 *الاستلام من:* "+B.ar+"\n👤 *الاسم:* "+nm+"\n📞 *الجوال:* "+ph+"\n━━━━━━━━━━━━\n🧾 *الطلب:*\n",k=0;
  cur().items.forEach(function(x){if(cart[x.id]){msg+=nums(k++)+" "+x.ar+" × "+cart[x.id]+" = "+(x.p*cart[x.id]).toFixed(3)+" ر.ع\n"}});
  msg+="━━━━━━━━━━━━\n💰 *المجموع:* "+total().toFixed(3)+" ر.ع\n💵 *الدفع:* عند الاستلام\n";
  var o=$("o1").value.trim();if(o)msg+="📝 *ملاحظات:* "+o+"\n";
  window.open("https://wa.me/"+B.ph+"?text="+encodeURIComponent(msg),"_blank");
 }
});
$("shade").addEventListener("click",function(){show(false)});
render();
</script>
</body>
</html>
